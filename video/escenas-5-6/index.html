<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>Escenas 5 y 6 — Recibo de luz</title>
  <script src="vendor/gsap.min.js"></script>
  <style>
    html, body { margin: 0; padding: 0; width: 1080px; height: 1920px; overflow: hidden; background: #0f1b3d; }
    #main { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: "Montserrat", sans-serif; }
    #fondo {
      position: absolute; inset: 0;
      background: radial-gradient(1200px 900px at 50% 30%, #1a2a5c, #0f1b3d 70%);
    }
    .capa { position: absolute; inset: 0; }
  </style>
</head>
<body>
  <!--
    Escenas 5 y 6 del video del recibo de luz (Contepequense), formato vertical 1080×1920.
    Esta composición dura 15 s: el segundo 0 local = 45 s del video completo.
      Escena 5 "Cómo pagar menos"          0–9 s  (45–54 s)
      Escena 6 "Participación del público"  9–15 s (54–60 s)
  -->
  <div id="main" data-composition-id="main" data-start="0" data-duration="15" data-width="1080" data-height="1920">
    <div id="fondo"></div>

    <div id="escena-5" class="capa"
      data-composition-id="escena-5" data-composition-src="compositions/escena-5.html"
      data-start="0" data-duration="9" data-track-index="1" data-track-kind="graphics"
      data-width="1080" data-height="1920"></div>

    <div id="escena-6" class="capa"
      data-composition-id="escena-6" data-composition-src="compositions/escena-6.html"
      data-start="9" data-duration="6" data-track-index="1" data-track-kind="graphics"
      data-width="1080" data-height="1920"></div>

    <div id="subtitulos" class="capa"
      data-composition-id="subtitulos" data-composition-src="compositions/subtitulos.html"
      data-start="0" data-duration="15" data-track-index="2" data-track-kind="captions"
      data-width="1080" data-height="1920"></div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </div>
</body>
</html>
