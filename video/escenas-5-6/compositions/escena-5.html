  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });

      // Entrada (0–1 s)
      tl.fromTo("#e5-pill", { xPercent: -50, y: -80, autoAlpha: 0 }, { xPercent: -50, y: 0, autoAlpha: 1, duration: 0.5, ease: "back.out(2)" }, 0);
      tl.fromTo("#e5-family", { y: 160, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.6, ease: "power3.out" }, 0.1);
      tl.fromTo("#e5-receipt", { y: 120, rotation: -6, autoAlpha: 0 }, { y: 0, rotation: 0, autoAlpha: 1, duration: 0.7, ease: "power3.out" }, 0.2);

      // La familia revisa el recibo: se inclinan hacia él
      tl.fromTo("#e5-dad", { rotation: 0 }, { rotation: 6, svgOrigin: "140 300", duration: 0.5, yoyo: true, repeat: 3, ease: "sine.inOut" }, 0.8);
      tl.fromTo("#e5-mom", { rotation: 0 }, { rotation: -6, svgOrigin: "460 300", duration: 0.5, yoyo: true, repeat: 3, ease: "sine.inOut" }, 0.9);
      tl.fromTo("#e5-kid", { y: 0 }, { y: -18, duration: 0.25, yoyo: true, repeat: 7, ease: "sine.inOut" }, 0.8);

      // Lupa sobre los kWh consumidos
      tl.fromTo("#e5-lens", { x: -320, y: -160, autoAlpha: 0 }, { x: 0, y: 0, autoAlpha: 1, duration: 0.8, ease: "power2.out" }, 1.0);
      tl.fromTo("#e5-kwh", { scale: 1 }, { scale: 1.08, duration: 0.3, yoyo: true, repeat: 3, ease: "sine.inOut" }, 1.8);

      // Paso 2: comparar (3.0–5.6 s)
      tl.fromTo(["#e5-receipt", "#e5-lens"], { x: 0 }, { x: -900, autoAlpha: 0, duration: 0.5, ease: "power2.in", immediateRender: false }, 2.9);
      tl.fromTo("#e5-compare", { x: 900, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.5, ease: "power2.out" }, 3.1);
      tl.fromTo("#e5-bar-prev", { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 1, duration: 0.6, ease: "power2.out" }, 3.5);
      tl.fromTo("#e5-bar-now", { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 1, duration: 0.7, ease: "power2.out" }, 3.9);
      tl.fromTo(["#e5-num-prev", "#e5-num-now"], { y: 20, autoAlpha: 0 }, { y: 0, autoAlpha: 1, stagger: 0.4, duration: 0.3 }, 3.8);
      tl.fromTo("#e5-delta", { scale: 0, rotation: -6, autoAlpha: 0 }, { scale: 1, rotation: -6, autoAlpha: 1, duration: 0.4, ease: "back.out(3)" }, 4.6);

      // Paso 3: desconectar y apagar (5.6–9 s)
      tl.fromTo("#e5-compare", { x: 0 }, { x: -900, autoAlpha: 0, duration: 0.5, ease: "power2.in", immediateRender: false }, 5.5);
      tl.fromTo("#e5-house", { x: 900, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.5, ease: "power2.out" }, 5.7);
      tl.fromTo("#e5-meter", { y: 40, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.4 }, 6.0);

      // Desconectar aparatos de alto consumo
      [["#e5-plug-2", "#e5-app-mw"], ["#e5-plug-3", "#e5-app-heat"], ["#e5-plug-1", "#e5-app-tv"]].forEach(([plug, app], i) => {
        const t = 6.3 + i * 0.45;
        tl.fromTo(plug, { y: 0, rotation: 0 }, { y: -60, rotation: i % 2 ? 18 : -18, duration: 0.3, ease: "power2.out" }, t);
        tl.fromTo(app + " .live", { opacity: 1, filter: "grayscale(0)" }, { opacity: 0.12, filter: "grayscale(1)", duration: 0.3 }, t + 0.1);
      });

      // Apagar luces una por una
      ["#e5-bulb-1", "#e5-bulb-2", "#e5-bulb-3"].forEach((b, i) => {
        const t = 7.5 + i * 0.3;
        tl.fromTo(b + " .glow", { autoAlpha: 1 }, { autoAlpha: 0, duration: 0.2 }, t);
        tl.fromTo(b + " .glass", { attr: { fill: "#ffd25a" } }, { attr: { fill: "#3a4566" }, duration: 0.2 }, t);
      });

      // El contador de consumo baja
      const meter = { v: 412 };
      const meterEl = document.getElementById("e5-meter-val");
      tl.fromTo(meter, { v: 412 }, {
        v: 298, duration: 2.4, ease: "power1.inOut",
        onUpdate: () => { meterEl.textContent = Math.round(meter.v); }
      }, 6.3);
      tl.fromTo("#e5-meter", { scale: 1 }, { scale: 1.1, duration: 0.25, yoyo: true, repeat: 1 }, 8.4);

      window.__timelines = window.__timelines || {};
      window.__timelines["escena-5"] = tl;
    })();
  </script>
