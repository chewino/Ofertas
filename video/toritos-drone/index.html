<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>Noche de toritos — Vista desde el dron</title>
  <script src="vendor/gsap.min.js"></script>
  <style>
    html, body { margin: 0; padding: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
    #main { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: "Montserrat", sans-serif; }
    .capa { position: absolute; inset: 0; }
  </style>
</head>
<body>
  <!--
    Reel vertical 1080×1920 (32 s) con fotos aéreas de la quema de toritos, montado sobre una pista a 120 BPM.
      0–4 s intro · 4–16 s drop 1 · 16–20 s pausa · 20–28 s drop 2 · 28–32 s cierre
      fotos   Cortes al ritmo, golpes de zoom, destellos, sacudidas y barras de cine
      textos  Título, palabras sobre el ritmo y cierre con llamado a comentar
      musica  Pista original sintetizada (audio/musica.m4a)
  -->
  <div id="main" data-composition-id="main" data-start="0" data-duration="32" data-width="1080" data-height="1920">
    <audio id="musica" src="audio/musica.m4a"
      data-start="0" data-duration="32" data-track-index="0" data-volume="1"></audio>

    <div id="fotos" class="capa"
      data-composition-id="fotos" data-composition-src="compositions/fotos.html"
      data-start="0" data-duration="32" data-track-index="1" data-track-kind="graphics"
      data-width="1080" data-height="1920"></div>

    <div id="textos" class="capa"
      data-composition-id="textos" data-composition-src="compositions/textos.html"
      data-start="0" data-duration="32" data-track-index="2" data-track-kind="graphics"
      data-width="1080" data-height="1920"></div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </div>
</body>
</html>
