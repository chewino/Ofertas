<template>
  <style>
    #root { position: absolute; inset: 0; color: #fff; font-family: "Montserrat", sans-serif; }
    #root .abs { position: absolute; }
    #root .sombra { text-shadow: 0 4px 0 rgba(0,0,0,.6), 0 0 18px rgba(0,0,0,.9), 0 0 40px rgba(0,0,0,.7); }
    #root .centro { left: 0; right: 0; text-align: center; }

    /* Intro */
    #i-presenta { top: 92px; font-size: 30px; font-weight: 700; letter-spacing: 14px; color: #ffb703; }
    #i-arriba { top: 760px; font-size: 44px; font-weight: 800; letter-spacing: 10px; }
    #i-titulo { top: 820px; font-size: 158px; font-weight: 900; letter-spacing: 8px; line-height: 1; color: #ffb703; }
    #i-abajo { bottom: 92px; font-size: 30px; font-weight: 700; letter-spacing: 14px; }

    /* Palabras sobre el ritmo */
    #root .palabra { top: 1380px; font-size: 150px; font-weight: 900; letter-spacing: 6px; line-height: 1; visibility: hidden; }
    #root .doble { top: 1330px; visibility: hidden; }
    #root .doble small { display: block; font-size: 52px; font-weight: 800; letter-spacing: 22px; margin-bottom: 8px; }
    #root .doble b { display: block; font-size: 140px; font-weight: 900; letter-spacing: 4px; line-height: 1; color: #ffb703; }

    /* Pausa */
    #p-1 { top: 780px; font-size: 64px; font-weight: 800; letter-spacing: 20px; visibility: hidden; }
    #p-2 { top: 870px; font-size: 120px; font-weight: 900; letter-spacing: 10px; color: #ffb703; visibility: hidden; }

    /* Cierre */
    #c-logo { left: 0; right: 0; top: 70px; margin: 0 auto; width: max-content; display: flex; align-items: center; gap: 18px; visibility: hidden; }
    #c-mark { width: 84px; height: 84px; border-radius: 50%; background: #ffb703;
              display: grid; place-items: center; box-shadow: 0 0 0 7px rgba(255,183,3,.25); }
    #c-logo .word { font-size: 50px; font-weight: 900; letter-spacing: 1px; }
    #c-logo .word span { color: #ffb703; }
    #c-pregunta { left: 60px; right: 60px; top: 1200px; padding: 28px 0; border-radius: 44px; background: rgba(0,0,0,.55);
                  text-align: center; font-size: 92px; font-weight: 900; line-height: 1.05; visibility: hidden; }
    #c-pregunta span { color: #ffb703; }
    #c-bubble {
      left: 0; right: 0; top: 1500px; margin: 0 auto; width: max-content;
      padding: 28px 44px; border-radius: 40px; background: #ffb703; color: #0b1430;
      font-size: 48px; font-weight: 900; white-space: nowrap; box-shadow: 0 12px 0 #fb8500; visibility: hidden;
    }
    #negro { position: absolute; inset: 0; background: #000; opacity: 0; }
  </style>

  <div id="root" data-composition-id="textos" data-width="1080" data-height="1920">
    <div id="i-presenta" class="abs centro">CONTEPEQUENSE PRESENTA</div>
    <div id="i-arriba" class="abs centro sombra">UNA NOCHE DE</div>
    <div id="i-titulo" class="abs centro sombra">TORITOS</div>
    <div id="i-abajo" class="abs centro">VISTA DESDE EL DRON</div>

    <div id="w-1" class="abs centro palabra sombra">TRADICIÓN</div>
    <div id="w-2" class="abs centro palabra sombra">FUEGO</div>
    <div id="w-3" class="abs centro palabra sombra">FIESTA</div>

    <div id="p-1" class="abs centro sombra">EL CIELO</div>
    <div id="p-2" class="abs centro sombra">SE ILUMINA</div>

    <div id="d-1" class="abs centro doble sombra"><small>NUESTRA</small><b>GENTE</b></div>
    <div id="d-2" class="abs centro doble sombra"><small>NUESTRA</small><b>PLAZA</b></div>
    <div id="d-3" class="abs centro doble sombra"><small>NUESTRA</small><b>FIESTA</b></div>

    <div id="c-logo" class="abs sombra">
      <div id="c-mark">
        <svg viewBox="0 0 60 60" width="50" height="50"><path d="M34 4 L12 34 h16 l-4 22 L48 24 H32z" fill="#0b1430" /></svg>
      </div>
      <div class="word">Contepe<span>quense</span></div>
    </div>
    <div id="c-pregunta" class="abs sombra">¿Tú también <span>estuviste ahí?</span></div>
    <div id="c-bubble" class="abs">¡Cuéntanos en los comentarios!</div>

    <div id="negro"></div>
  </div>

  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });

      // Intro: el título está en pantalla desde el cuadro 0 (miniatura en redes); el espaciado se cierra
      // Separa el texto en letras y las abre desde el centro: el espaciado se anima con transformaciones
      function letras(sel) {
        const el = document.querySelector(sel);
        const txt = el.textContent;
        el.textContent = "";
        return Array.from(txt).map((c) => {
          const s = document.createElement("span");
          s.textContent = c;
          s.style.display = "inline-block";
          s.style.whiteSpace = "pre";
          el.appendChild(s);
          return s;
        });
      }
      function abrir(sel, px, t, d) {
        const ls = letras(sel), m = (ls.length - 1) / 2;
        ls.forEach((s, i) => tl.fromTo(s, { x: (i - m) * px }, { x: 0, duration: d, ease: "power2.out" }, t));
      }
      abrir("#i-titulo", 14, 0, 3.5);
      abrir("#i-arriba", 10, 0, 3.5);
      tl.to(["#i-titulo", "#i-arriba"], { scale: 2.2, autoAlpha: 0, duration: 0.45, ease: "expo.in" }, 3.55);
      tl.to(["#i-presenta", "#i-abajo"], { autoAlpha: 0, duration: 0.3 }, 3.7);

      // Palabras golpeando con el ritmo (drop 1)
      [["#w-1", 6], ["#w-2", 8], ["#w-3", 10]].forEach(([w, t]) => {
        tl.set(w, { autoAlpha: 1 }, t);
        tl.fromTo(w, { scale: 1.5 }, { scale: 1, duration: 0.18, ease: "expo.out", immediateRender: false }, t);
        tl.to(w, { scale: 1.08, duration: 1.3, ease: "none" }, t + 0.18);
        tl.set(w, { autoAlpha: 0 }, t + 1.5);
      });

      // Pausa: texto lento
      tl.set(["#p-1", "#p-2"], { autoAlpha: 1 }, 16.4);
      tl.fromTo("#p-1", { opacity: 0 }, { opacity: 1, duration: 1.4, ease: "power2.out", immediateRender: false }, 16.4);
      abrir("#p-1", 22, 16.4, 1.6);
      tl.fromTo("#p-2", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 1.0, ease: "power2.out", immediateRender: false }, 17.0);
      tl.to(["#p-1", "#p-2"], { scale: 2, opacity: 0, duration: 0.45, ease: "expo.in" }, 19.55);

      // Drop 2
      [["#d-1", 22], ["#d-2", 24], ["#d-3", 26]].forEach(([w, t]) => {
        tl.set(w, { autoAlpha: 1 }, t);
        tl.fromTo(w + " b", { scale: 1.5 }, { scale: 1, duration: 0.18, ease: "expo.out", immediateRender: false }, t);
        tl.fromTo(w + " small", { y: -30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.25, ease: "power3.out", immediateRender: false }, t);
        tl.set(w, { autoAlpha: 0 }, t + 1.75);
      });

      // Cierre
      tl.set(["#c-logo", "#c-pregunta", "#c-bubble"], { autoAlpha: 1 }, 28.5);
      tl.fromTo("#c-logo", { y: -60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "back.out(2)", immediateRender: false }, 28.5);
      tl.fromTo("#c-pregunta", { scale: 0.8, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: "back.out(2)", immediateRender: false }, 28.8);
      tl.fromTo("#c-bubble", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(2.5)", immediateRender: false }, 29.4);
      tl.to("#c-mark", { scale: 1.15, duration: 0.3, yoyo: true, repeat: 1 }, 30.0);
      tl.to("#negro", { opacity: 1, duration: 0.7, ease: "power1.in" }, 31.3);

      window.__timelines = window.__timelines || {};
      window.__timelines["textos"] = tl;
    })();
  </script>
