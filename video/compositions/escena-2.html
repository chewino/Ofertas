  <script>
    (function () {
      // Tiempos de la narración (tiempos.js): F[i] = frase i, en segundos locales de la escena
      const F = window.GUION.escenas["escena-2"].frases;
      const tl = gsap.timeline({ paused: true });

      tl.fromTo("#e2-pill", { y: -80, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.5, ease: "back.out(2)" }, 0);
      tl.fromTo("#e2-receipt", { y: 140, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.6, ease: "power3.out" }, 0.2);

      // Resalta un dato del recibo (y apaga el anterior)
      function resaltar(n, t) {
        if (n > 1) tl.fromTo("#e2-hl-" + (n - 1), { scale: 1 }, { scale: 0.95, autoAlpha: 0, duration: 0.25, immediateRender: false }, t);
        tl.fromTo("#e2-hl-" + n, { autoAlpha: 0, scale: 0.95 }, { autoAlpha: 1, scale: 1, duration: 0.3 }, t + 0.1);
        tl.fromTo("#e2-badge-" + n, { scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.35, ease: "back.out(3)" }, t + 0.15);
      }

      // 1 · La tarifa ("tu tarifa, que viene impresa en el recibo…")
      resaltar(1, F[1].start);
      tl.fromTo("#e2-tarifa", { scale: 1 }, { scale: 1.4, transformOrigin: "100% 50%", duration: 0.25, yoyo: true, repeat: 1, ease: "sine.inOut" }, F[1].end - 1.2);
      // 2 · El periodo (normalmente dos meses)
      resaltar(2, F[2].start);
      tl.fromTo("#e2-periodo-chip", { scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.35, ease: "back.out(3)" }, F[2].start + 1.2);
      // 3 · Las lecturas del medidor: actual y anterior
      resaltar(3, F[3].start);
      tl.fromTo("#e2-meter", { y: 60, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.4, ease: "power2.out" }, F[3].start + 0.2);
      const meter = { v: 18330 };
      const meterEl = document.getElementById("e2-meter-val");
      tl.fromTo(meter, { v: 18330 }, {
        v: 18742, duration: F[3].end - F[3].start, ease: "power1.inOut",
        onUpdate: () => { meterEl.textContent = String(Math.round(meter.v)); }
      }, F[3].start + 0.5);
      // 4 · El total a pagar
      resaltar(4, F[4].start);
      tl.fromTo("#e2-meter", { y: 0 }, { y: 60, autoAlpha: 0, duration: 0.3, immediateRender: false }, F[4].start);
      tl.fromTo("#e2-total", { scale: 1 }, { scale: 1.12, duration: 0.25, yoyo: true, repeat: 1, ease: "sine.inOut" }, F[4].start + 0.6);

      window.__timelines = window.__timelines || {};
      window.__timelines["escena-2"] = tl;
    })();
  </script>
