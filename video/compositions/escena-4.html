  <script>
    (function () {
      // Tiempos de la narración (tiempos.js): F[i] = frase i, en segundos locales de la escena
      const F = window.GUION.escenas["escena-4"].frases;
      const tl = gsap.timeline({ paused: true });
      gsap.set("#e4-bars .ok", { attr: { fill: "#2ec4b6" } });
      gsap.set("#e4-bars .over", { attr: { fill: "#ef476f" } });
      gsap.set(["#e4-needle", "#e4-gauge"], { svgOrigin: "540 880" });

      tl.fromTo("#e4-pill", { y: -80, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.5, ease: "back.out(2)" }, 0);
      tl.fromTo("#e4-gauge", { scale: 0.8, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.5, ease: "back.out(1.6)" }, 0.2);
      tl.fromTo("#e4-needle", { rotation: -90 }, { rotation: -70, duration: 0.5, ease: "power2.out" }, 0.4);

      // "Si tu promedio mensual de los últimos doce meses…": van saliendo los 12 meses
      const meses = F[1].end - F[0].start - 0.6;
      tl.fromTo("#e4-avg-lbl", { y: 20, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.3 }, F[0].start);
      tl.fromTo("#e4-bars .bar", { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 1, duration: 0.3, stagger: (meses - 0.3) / 11, ease: "power2.out" }, F[0].start + 0.3);
      tl.fromTo("#e4-needle", { rotation: -70 }, { rotation: 0, duration: meses, ease: "none", immediateRender: false }, F[0].start + 0.3);

      // "…pasa de 250 kWh en tarifa 1, o del límite de tu tarifa"
      tl.fromTo("#e4-limit", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.3 }, F[1].start);
      tl.fromTo("#e4-limits .lim", { y: 30, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.3, stagger: 0.12 }, F[1].start + 2.2);

      // "CFE te cambia a la tarifa DAC, sin subsidio"
      tl.fromTo("#e4-needle", { rotation: 0 }, { rotation: 64, duration: 1.0, ease: "elastic.out(1, 0.45)", immediateRender: false }, F[2].start);
      tl.fromTo("#e4-red-glow", { opacity: 0 }, { opacity: 0.6, duration: 0.25, yoyo: true, repeat: 3 }, F[2].start + 0.1);
      tl.fromTo("#e4-dac", { scale: 1 }, { scale: 1.25, transformOrigin: "50% 50%", duration: 0.25, yoyo: true, repeat: 1 }, F[2].start + 0.2);
      tl.fromTo("#e4-avg-lbl", { y: 0 }, { y: -20, autoAlpha: 0, duration: 0.25, immediateRender: false }, F[2].start + 0.6);
      tl.fromTo("#e4-stamp", { scale: 2.2, rotation: -6, autoAlpha: 0 }, { scale: 1, rotation: -6, autoAlpha: 1, duration: 0.3, ease: "power3.in" }, F[2].end - 1.1);
      tl.fromTo("#e4-stamp", { x: 0 }, { x: 10, duration: 0.05, repeat: 5, yoyo: true, ease: "none", immediateRender: false }, F[2].end - 0.8);

      // "Y para salir de ella, tienes que bajar ese promedio"
      tl.fromTo("#e4-stamp", { scale: 1 }, { scale: 0.8, autoAlpha: 0, duration: 0.3, immediateRender: false }, F[3].start);
      tl.fromTo("#e4-exit", { scale: 0.5, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.35, ease: "back.out(2.5)" }, F[3].start + 0.2);
      tl.fromTo("#e4-bars .over", { scaleY: 1 }, {
        scaleY: (i, el) => 165 / Number(el.getAttribute("height")),
        attr: { fill: "#2ec4b6" }, duration: 0.6, stagger: 0.12, ease: "power2.inOut", immediateRender: false,
      }, F[3].start + 1.0);
      tl.fromTo("#e4-needle", { rotation: 64 }, { rotation: -40, duration: 1.2, ease: "power2.inOut", immediateRender: false }, F[3].start + 1.2);

      window.__timelines = window.__timelines || {};
      window.__timelines["escena-4"] = tl;
    })();
