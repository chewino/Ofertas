<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>Escenas 1 a 4 — Recibo de luz</title>
  <script src="vendor/gsap.min.js"></script>
  <style>
    html, body { margin: 0; padding: 0; width: 1080px; height: 1920px; overflow: hidden; background: #0f1b3d; }
    #main { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: "Montserrat", sans-serif; }
    #fondo {
      position: absolute; inset: 0;
      background: radial-gradient(1200px 900px at 50% 30%, #1a2a5c, #0f1b3d 70%);
    }
    .capa { position: absolute; inset: 0; }
  </style>
</head>
<body>
  <!--
    Escenas 1 a 4 del video del recibo de luz (Contepequense), formato vertical 1080×1920.
    Esta composición dura 45 s y coincide con los segundos 0–45 del video completo.
      Escena 1 "El gancho"                    0–8 s
      Escena 2 "Las partes del recibo"        8–20 s
      Escena 3 "Por qué sube tanto"          20–33 s
      Escena 4 "Cuidado con la tarifa DAC"   33–45 s
  -->
  <div id="main" data-composition-id="main" data-start="0" data-duration="45" data-width="1080" data-height="1920">
    <div id="fondo"></div>

    <div id="escena-1" class="capa"
      data-composition-id="escena-1" data-composition-src="compositions/escena-1.html"
      data-start="0" data-duration="8" data-track-index="1" data-track-kind="graphics"
      data-width="1080" data-height="1920"></div>

    <div id="escena-2" class="capa"
      data-composition-id="escena-2" data-composition-src="compositions/escena-2.html"
      data-start="8" data-duration="12" data-track-index="1" data-track-kind="graphics"
      data-width="1080" data-height="1920"></div>

    <div id="escena-3" class="capa"
      data-composition-id="escena-3" data-composition-src="compositions/escena-3.html"
      data-start="20" data-duration="13" data-track-index="1" data-track-kind="graphics"
      data-width="1080" data-height="1920"></div>

    <div id="escena-4" class="capa"
      data-composition-id="escena-4" data-composition-src="compositions/escena-4.html"
      data-start="33" data-duration="12" data-track-index="1" data-track-kind="graphics"
      data-width="1080" data-height="1920"></div>

    <div id="subtitulos-1-4" class="capa"
      data-composition-id="subtitulos-1-4" data-composition-src="compositions/subtitulos-1-4.html"
      data-start="0" data-duration="45" data-track-index="2" data-track-kind="captions"
      data-width="1080" data-height="1920"></div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </div>
</body>
</html>
