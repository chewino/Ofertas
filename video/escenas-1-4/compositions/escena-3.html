<template>

  <div id="root" data-composition-id="escena-3" data-width="1080" data-height="1920">

    <div id="e3-math" class="abs">
      <div id="e3-ln-1" class="ln">18,742</div>
      <div id="e3-ln-2" class="ln minus">− 18,330</div>

      <div id="e3-result"><span id="e3-result-val">412</span> <small>kWh</small></div>

  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });

      tl.fromTo("#e3-pill", { y: -80, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.5, ease: "back.out(2)" }, 0);

      // 0–3.2 s · Lectura actual − lectura anterior = kWh consumidos
      tl.fromTo("#e3-ln-1", { x: 80, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.4, ease: "power2.out" }, 0.2);
      tl.fromTo("#e3-ln-2", { x: 80, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.4, ease: "power2.out" }, 0.6);
      tl.fromTo("#e3-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power2.out" }, 1.0);
      tl.fromTo("#e3-result", { scale: 0.6, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.35, ease: "back.out(2)" }, 1.2);
      const result = { v: 0 };
      const resultEl = document.getElementById("e3-result-val");
      tl.fromTo(result, { v: 0 }, {
        v: 412, duration: 1.2, ease: "power2.out",
        onUpdate: () => { resultEl.textContent = Math.round(result.v); }
      }, 1.2);
      tl.fromTo("#e3-math", { y: 0 }, { y: -80, autoAlpha: 0, duration: 0.35, ease: "power2.in" }, 3.1);
      tl.fromTo("#e3-chip", { scale: 0.5, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.35, ease: "back.out(2.5)" }, 3.3);

      // 3.4 s · "Se cobran por escalones"

        tl.fromTo(s, { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 1, duration: 0.5, ease: "power3.out" }, 3.6 + i * 0.4);
      });
      tl.fromTo("#root .step .price", { autoAlpha: 0 }, { autoAlpha: 0.35, duration: 0.3 }, 4.8);

      // 6.4 s · "Los primeros salen baratos"
      tl.fromTo("#e3-step-1", { backgroundColor: "#2c3a6d" }, { backgroundColor: "#1a8f84", duration: 0.3, immediateRender: false }, 6.4);
      tl.fromTo("#e3-step-1 .price", { autoAlpha: 0.35 }, { autoAlpha: 1, duration: 0.3, immediateRender: false }, 6.4);
      tl.fromTo("#e3-coin-1", { y: -220, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.6, ease: "bounce.out" }, 6.5);
      tl.fromTo("#e3-step-2", { backgroundColor: "#2c3a6d" }, { backgroundColor: "#b35400", duration: 0.3, immediateRender: false }, 7.2);
      tl.fromTo("#e3-step-2 .price", { autoAlpha: 0.35 }, { autoAlpha: 1, duration: 0.3, immediateRender: false }, 7.2);
      tl.fromTo("#e3-coin-2", { y: -260, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.6, ease: "bounce.out" }, 7.3);

      // 9.0 s · "Pero los de consumo excedente cuestan varias veces más"
      tl.fromTo("#e3-step-3", { backgroundColor: "#2c3a6d" }, { backgroundColor: "#d62850", duration: 0.3, immediateRender: false }, 9.0);
      tl.fromTo("#e3-step-3 .price", { autoAlpha: 0.35 }, { autoAlpha: 1, duration: 0.3, immediateRender: false }, 9.0);
      tl.fromTo("#e3-coin-3", { y: -320, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.7, ease: "bounce.out" }, 9.1);
      tl.fromTo("#e3-step-3", { x: 0 }, { x: 14, duration: 0.06, repeat: 7, yoyo: true, ease: "none", immediateRender: false }, 9.75);
      tl.fromTo("#e3-hot", { scale: 0, rotation: -6, autoAlpha: 0 }, { scale: 1, rotation: -6, autoAlpha: 1, duration: 0.4, ease: "back.out(3)" }, 9.8);
      tl.fromTo("#e3-hot", { scale: 1 }, { scale: 1.08, duration: 0.25, yoyo: true, repeat: 1, ease: "sine.inOut", immediateRender: false }, 11.2);

      window.__timelines = window.__timelines || {};
      window.__timelines["escena-3"] = tl;
    })();
  </script>
